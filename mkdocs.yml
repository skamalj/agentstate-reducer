site_name: Agent State Management
site_description: A one-stop toolkit for AI agent state management — message pruning and persistence for LangGraph and CrewAI
site_url: https://skamalj.github.io/agentstate-reducer/
repo_url: https://github.com/skamalj/agentstate-reducer
repo_name: skamalj/agentstate-reducer

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Concepts:
      - State Management Overview: concepts/overview.md
      - Choosing an Approach: concepts/choosing.md
  - agentstate-reducer:
      - Overview: reducer/index.md
      - Message-Count Pruning: reducer/message-count.md
      - Token-Budget Pruning: reducer/token-budget.md
      - Summarization: reducer/summarization.md
      - API Reference: reducer/api.md
  - LangGraph Checkpointers:
      - CosmosDB: langgraph/cosmosdb.md
      - Firestore: langgraph/firestore.md
  - CrewAI Persistence:
      - CosmosDB: crewai/cosmosdb.md
      - Firestore: crewai/firestore.md
